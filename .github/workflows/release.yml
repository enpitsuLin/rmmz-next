name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Validate release tag
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const { version } = JSON.parse(readFileSync('packages/rmmz-next/package.json', 'utf8'))
          const expectedTag = `v${version}`
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Git tag ${process.env.GITHUB_REF_NAME} does not match ${expectedTag}`)
          }

          const [versionWithoutBuildMetadata] = version.split('+', 1)
          const prereleaseIdentifier = versionWithoutBuildMetadata.match(/-([^.]*)/)?.[1]
          if (prereleaseIdentifier !== undefined && !['alpha', 'beta', 'rc'].includes(prereleaseIdentifier)) {
            throw new Error(`Unsupported prerelease identifier "${prereleaseIdentifier}". Expected alpha, beta, or rc.`)
          }

          const distTag = prereleaseIdentifier ?? 'latest'
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${distTag}\n`)
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: pnpm --filter rmmz-next publish --access public --no-git-checks --tag "$NPM_DIST_TAG"

      - name: Generate GitHub Changelog
        run: pnpx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
